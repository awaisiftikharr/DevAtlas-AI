services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devatlas}
      POSTGRES_USER: ${POSTGRES_USER:-devatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devatlas_local_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devatlas} -d ${POSTGRES_DB:-devatlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devatlas}:${POSTGRES_PASSWORD:-devatlas_local_password}@db:5432/${POSTGRES_DB:-devatlas}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [backend]
volumes:
  postgres_data:
